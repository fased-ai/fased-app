name: Dual-track desktop & CLI packages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dual-track-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cli-archives:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: npm ci
      - run: npm run build
      - name: Validate install entry scripts
        run: |
          /bin/bash -n install.sh
          node --test scripts/install-entry.test.mjs scripts/linux-desktop-package.test.mjs
      - name: Cross-build headless CLI archives
        shell: bash
        run: |
          set -euo pipefail
          out=".evidence/dual-track-cli"
          rm -rf "$out"
          mkdir -p "$out"
          for target in linux:amd64 linux:arm64 darwin:arm64 darwin:amd64 windows:amd64 windows:arm64; do
            os="${target%%:*}"
            arch="${target##*:}"
            ext=""
            if [[ "$os" == "windows" ]]; then ext=".exe"; fi
            stage="$out/fased-app-${os}-${arch}"
            mkdir -p "$stage"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "${stage}/fased-app${ext}" ./cmd/fased-app
            if [[ "$os" == "linux" ]]; then
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "${stage}/fased-signer" ./cmd/fased-signer
            fi
            cp LICENSE NOTICE "$stage/"
            if [[ "$os" == "windows" ]]; then
              (cd "$out" && python3 -c "import shutil; shutil.make_archive('fased-app-${os}-${arch}', 'zip', '.', 'fased-app-${os}-${arch}')")
            else
              tar -C "$out" -czf "$out/fased-app-${os}-${arch}.tar.gz" "fased-app-${os}-${arch}"
            fi
            rm -rf "$stage"
          done
          cp install.sh install.ps1 "$out/"
          (cd "$out" && sha256sum fased-app-*.tar.gz fased-app-*.zip install.sh install.ps1 > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: fased-cli-archives
          path: .evidence/dual-track-cli/
          retention-days: 7

  desktop-installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - run: npm ci
      - run: npm run build
      - name: Linux native build prerequisites
        if: runner.os == 'Linux'
        run: |
          node scripts/ci-ubuntu-mirror.mjs
          sudo install -m 0644 .evidence/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev desktop-file-utils dpkg-dev
      - run: go -C desktop mod verify
      - run: npm run build:desktop
      - run: npm run build:core
      - name: Linux desktop packaging unit checks
        if: runner.os == 'Linux'
        run: node --test scripts/linux-desktop-package.test.mjs
      - run: npm run package:native
      - uses: actions/upload-artifact@v4
        with:
          name: fased-desktop-${{ matrix.os }}
          path: |
            .evidence/packages/*.zip
            .evidence/packages/*.tar.gz
            .evidence/packages/*.exe
            .evidence/packages/*.dmg
            .evidence/packages/*.deb
            .evidence/packages/*.AppImage
            .evidence/native-package-result.json
          retention-days: 7
