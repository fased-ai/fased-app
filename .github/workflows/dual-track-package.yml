name: Dual-track desktop & CLI packages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dual-track-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cli-archives:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: npm ci
      - run: npm run build
      - name: Validate install entry scripts
        run: |
          /bin/bash -n install.sh install-cli.sh
          node --test scripts/install-entry.test.mjs scripts/linux-desktop-package.test.mjs scripts/build-dual-track-cli.test.mjs scripts/signing-helpers.test.mjs scripts/smoke-dual-track-installers.test.mjs
      - name: Cross-build headless CLI archives and installers
        run: node scripts/build-dual-track-cli.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: fased-cli-archives
          path: .evidence/dual-track-cli/
          retention-days: 7

  desktop-installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - run: npm ci
      - run: npm run build
      - name: Linux native build prerequisites
        if: runner.os == 'Linux'
        run: |
          node scripts/ci-ubuntu-mirror.mjs
          sudo install -m 0644 .evidence/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev desktop-file-utils dpkg-dev curl
          if [ "$(uname -m)" = "x86_64" ]; then
            curl -fsSL -o /tmp/appimagetool "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
            echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum --check -
            sudo install -m 0755 /tmp/appimagetool /usr/local/bin/appimagetool
            rm -f /tmp/appimagetool
          fi
      - run: go -C desktop mod verify
      - run: npm run build:desktop
      - run: npm run build:core
      - name: Linux desktop packaging unit checks
        if: runner.os == 'Linux'
        run: node --test scripts/linux-desktop-package.test.mjs
      - name: Import Apple Developer signing certificate and notary credentials (when configured)
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.APPLE_NOTARY_KEYCHAIN_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          has_p12=0; has_pw=0; has_id=0
          [[ -n "${APPLE_CERT_P12_BASE64:-}" ]] && has_p12=1
          [[ -n "${APPLE_CERT_PASSWORD:-}" ]] && has_pw=1
          [[ -n "${APPLE_SIGNING_IDENTITY:-}" ]] && has_id=1
          if (( has_p12 != has_pw )); then
            echo "::error::Set both APPLE_CERT_P12_BASE64 and APPLE_CERT_PASSWORD." >&2
            exit 1
          fi
          if (( has_p12 == 1 && has_id == 0 )); then
            echo "::error::APPLE_CERT_P12_BASE64 requires APPLE_SIGNING_IDENTITY." >&2
            exit 1
          fi
          notary_parts=0
          [[ -n "${APPLE_ID:-}" ]] && notary_parts=$((notary_parts + 1))
          [[ -n "${APPLE_TEAM_ID:-}" ]] && notary_parts=$((notary_parts + 1))
          [[ -n "${APPLE_APP_PASSWORD:-}" ]] && notary_parts=$((notary_parts + 1))
          if (( notary_parts > 0 && notary_parts < 3 )); then
            echo "::error::Set APPLE_ID, APPLE_TEAM_ID, and APPLE_APP_PASSWORD together." >&2
            exit 1
          fi
          if (( (notary_parts == 3 || ${#APPLE_NOTARY_KEYCHAIN_PROFILE} > 0) && has_id == 0 )); then
            echo "::error::Apple notarization requires APPLE_SIGNING_IDENTITY." >&2
            exit 1
          fi
          if (( has_p12 == 1 )); then
            KEYCHAIN_PATH="$RUNNER_TEMP/fased-signing.keychain-db"
            P12_PATH="$RUNNER_TEMP/fased-signing.p12"
            KEYCHAIN_PW="$(openssl rand -hex 24)"
            printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$P12_PATH"
            chmod 600 "$P12_PATH"
            security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
            security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
            echo "APPLE_NOTARY_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
            if (( notary_parts == 3 )) && [[ -z "${APPLE_NOTARY_KEYCHAIN_PROFILE:-}" ]]; then
              xcrun notarytool store-credentials "fased-notary" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --keychain "$KEYCHAIN_PATH"
              echo "APPLE_NOTARY_KEYCHAIN_PROFILE=fased-notary" >> "$GITHUB_ENV"
            fi
          fi
      - name: Materialize Windows Authenticode PFX (when configured)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGN_CERT_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_PFX_BASE64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          $hasB64 = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_CERT_PFX_BASE64)
          $hasPw = -not [string]::IsNullOrEmpty($env:WINDOWS_SIGN_CERT_PASSWORD)
          if ($hasB64 -ne $hasPw) {
            throw "Partial Windows signing secrets: set both WINDOWS_SIGN_CERT_PFX_BASE64 and WINDOWS_SIGN_CERT_PASSWORD."
          }
          if ($hasB64 -and $hasPw) {
            $pfxOut = Join-Path $env:RUNNER_TEMP 'fased-codesign.pfx'
            [System.IO.File]::WriteAllBytes($pfxOut, [System.Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_PFX_BASE64.Trim()))
            "WINDOWS_SIGN_CERT_PFX_PATH=$pfxOut" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Build native installer packages (optional signing hooks)
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.APPLE_NOTARY_KEYCHAIN_PROFILE || env.APPLE_NOTARY_KEYCHAIN_PROFILE }}
          APPLE_NOTARY_KEYCHAIN: ${{ env.APPLE_NOTARY_KEYCHAIN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          WINDOWS_SIGN_CERT_PFX_PATH: ${{ secrets.WINDOWS_SIGN_CERT_PFX_PATH || env.WINDOWS_SIGN_CERT_PFX_PATH }}
          WINDOWS_SIGN_CERT_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_PFX_BASE64 }}
          WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGN_TIMESTAMP_URL }}
        run: npm run package:native
      - name: Clean up ephemeral Apple signing credentials
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/fased-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/fased-signing.p12" "$RUNNER_TEMP/fased-signing.keychain-db"
      - name: Clean up ephemeral Windows Authenticode PFX
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'fased-codesign.pfx'
          if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: fased-desktop-${{ matrix.os }}
          path: |
            .evidence/packages/*.zip
            .evidence/packages/*.tar.gz
            .evidence/packages/*.exe
            .evidence/packages/*.dmg
            .evidence/packages/*.deb
            .evidence/packages/*.AppImage
            .evidence/native-package-result.json
          retention-days: 7

  installer-host-smoke:
    needs: [cli-archives, desktop-installers]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: fased-cli-archives
          path: .evidence/dual-track-cli
      - uses: actions/download-artifact@v4
        with:
          name: fased-desktop-${{ matrix.os }}
          path: .evidence
      - name: Linux host smoke prerequisites and user systemd session
        if: runner.os == 'Linux'
        run: |
          node scripts/ci-ubuntu-mirror.mjs
          sudo install -m 0644 .evidence/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap dpkg openssl
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Run real-host installer & package smoke verification
        run: node scripts/smoke-dual-track-installers.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fased-host-smoke-${{ matrix.os }}
          path: .evidence/dual-track-host-smoke-*.json
          include-hidden-files: true
          retention-days: 7
