name: Provider Contract Canary

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      strict_network:
        description: "Fail even when shared CI IPs hit HTTP 403/429 challenges"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  contract-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Verify offline recorded cassettes and live keyless provider contracts
        env:
          STRICT_NETWORK: ${{ inputs.strict_network }}
        run: |
          node --test scripts/check-contract-canary.test.mjs
          if [ "$STRICT_NETWORK" = "true" ]; then
            node scripts/check-contract-canary.mjs --live --strict
          else
            node scripts/check-contract-canary.mjs --live
          fi
