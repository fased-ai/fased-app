name: Ubuntu release candidate
on:
  workflow_dispatch:
    inputs:
      source:
        description: Reviewed main commit to stage
        required: true
        type: string
      candidate_run:
        description: Optional original candidate run to accept without rebuilding
        required: false
        default: ""
        type: string
      candidate_attempt:
        description: Original candidate attempt, required only for acceptance replay
        required: false
        default: ""
        type: string
permissions:
  contents: read
concurrency:
  group: ubuntu-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate-inputs:
    runs-on: ubuntu-24.04
    steps:
      - name: Require reviewed source and complete replay inputs
        env:
          FASED_INPUT_SOURCE: ${{ inputs.source }}
          FASED_REPLAY_RUN_ID: ${{ inputs.candidate_run }}
          FASED_REPLAY_RUN_ATTEMPT: ${{ inputs.candidate_attempt }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || "$FASED_INPUT_SOURCE" != "$GITHUB_SHA" ]]; then
            echo 'Reviewed main source is required.' >&2
            exit 1
          fi
          if [[ -z "$FASED_REPLAY_RUN_ID" && -z "$FASED_REPLAY_RUN_ATTEMPT" ]]; then exit 0; fi
          if [[ ! "$FASED_REPLAY_RUN_ID" =~ ^[1-9][0-9]*$ || ! "$FASED_REPLAY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ || "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo 'Replay requires an exact original run/attempt and one new acceptance dispatch.' >&2
            exit 1
          fi
  ubuntu-amd64:
    needs: candidate-inputs
    if: inputs.candidate_run == '' && inputs.candidate_attempt == '' && github.ref == 'refs/heads/main' && github.sha == inputs.source && github.repository == 'fased-ai/fased-app' && github.repository_id == '1426211857' && github.repository_owner_id == '279582504'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      FASED_RELEASE_SOURCE: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require approved production inputs before building
        id: prepare
        run: node scripts/prepare-ubuntu-release.mjs prepare
      - name: Build the locked UI once
        run: |
          npm ci
          npm run build
      - name: Build and package the reviewed core, signer and verifier once
        env:
          FASED_RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
          GOFLAGS: -mod=readonly -overlay=${{ steps.prepare.outputs.overlay }}
        run: |
          go mod verify
          node scripts/build-core.mjs --version="$FASED_RELEASE_VERSION"
          go build -trimpath -o .evidence/bin/fased-signer ./cmd/fased-signer
          node scripts/build-core.mjs --installer --version="$FASED_RELEASE_VERSION" --wallet-signer=.evidence/bin/fased-signer --source="$GITHUB_SHA"
          go run -ldflags "-X github.com/fased-ai/fased-app/internal/core.Version=$FASED_RELEASE_VERSION" ./cmd/fased-package --engine .evidence/bin/fased-app --source "$GITHUB_SHA" --out .evidence/ubuntu-release --ubuntu-release-format
          cp .evidence/bin/fased-install .evidence/ubuntu-release/fased-install-linux-amd64
          node scripts/prepare-ubuntu-release.mjs inventory
      - name: Attest the actual archive from this main-dispatch run
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            .evidence/ubuntu-release/fased-app-linux-amd64.tar.gz
            .evidence/ubuntu-release/fased-install-linux-amd64
          push-to-registry: false
          create-storage-record: false
      - name: Verify original provenance offline and stage public signing inputs
        env:
          FASED_PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$FASED_PROVENANCE_BUNDLE" .evidence/ubuntu-release/fased-app-linux-amd64.provenance.sigstore.json
          go run ./cmd/fased-release-candidate verify-provenance --policy-file .evidence/ubuntu-release/provenance-policy.json --expected-file .evidence/ubuntu-release/expected-provenance.json --bundle-file .evidence/ubuntu-release/fased-app-linux-amd64.provenance.sigstore.json > .evidence/ubuntu-release/verified-provenance.json
          node scripts/prepare-ubuntu-release.mjs finish
      - name: Preserve verified staged artifact modes
        run: chmod 600 .evidence/ubuntu-release/fased-app-linux-amd64.tar.gz .evidence/ubuntu-release/fased-install-linux-amd64 .evidence/ubuntu-release/fased-app-linux-amd64.provenance.sigstore.json .evidence/ubuntu-release/install.sh .evidence/ubuntu-release/fased-release.json .evidence/ubuntu-release/first-install-seed.json
      - name: Retain original verified release artifacts
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubuntu-amd64-release-candidate-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
          path: |
            .evidence/ubuntu-release/fased-app-linux-amd64.tar.gz
            .evidence/ubuntu-release/fased-app-linux-amd64.json
            .evidence/ubuntu-release/fased-install-linux-amd64
            .evidence/ubuntu-release/fased-app-linux-amd64.provenance.sigstore.json
            .evidence/ubuntu-release/verified-provenance.json
            .evidence/ubuntu-release/expected-provenance.json
            .evidence/ubuntu-release/provenance-policy.json
            .evidence/ubuntu-release/first-install-seed.json
            .evidence/ubuntu-release/install.sh
            .evidence/ubuntu-release/build-inputs.json
            .evidence/ubuntu-release/artifact-inventory.json
            .evidence/ubuntu-release/signing-inputs.json
            .evidence/ubuntu-release/fased-release.json
  installed-acceptance:
    needs: [candidate-inputs, ubuntu-amd64]
    if: always() && needs.candidate-inputs.result == 'success' && github.ref == 'refs/heads/main' && github.sha == inputs.source && github.repository == 'fased-ai/fased-app' && github.repository_id == '1426211857' && github.repository_owner_id == '279582504' && (needs.ubuntu-amd64.result == 'success' || (needs.ubuntu-amd64.result == 'skipped' && inputs.candidate_run != '' && inputs.candidate_attempt != '' && github.run_attempt == 1))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.candidate_run == ''
        with:
          name: ubuntu-amd64-release-candidate-${{ inputs.candidate_attempt || github.run_attempt }}
          run-id: ${{ inputs.candidate_run || github.run_id }}
          github-token: ${{ github.token }}
          path: .evidence/ubuntu-release
      - name: Authenticate original candidate before acceptance-only execution
        if: inputs.candidate_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FASED_REPLAY_RUN_ID: ${{ inputs.candidate_run }}
          FASED_REPLAY_RUN_ATTEMPT: ${{ inputs.candidate_attempt }}
        run: |
          mkdir -p .evidence
          node scripts/prepare-ubuntu-release.mjs replay
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare the existing disposable Ubuntu acceptance runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 qemu-utils xorriso
          # Same owner-only policy as inspection-acceptance.yml; an ad-hoc
          # user ACL does not survive the device's udev refresh.
          fased_vm_owner="$(id -un)"
          printf 'KERNEL=="kvm", OWNER="%s", MODE="0600"\n' "$fased_vm_owner" > .evidence/99-fased-fixture-kvm.rules
          sudo install -o root -g root -m 0644 .evidence/99-fased-fixture-kvm.rules /etc/udev/rules.d/99-fased-fixture-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          npm ci
          npx playwright install --with-deps chromium
          mkdir -p .evidence/ubuntu-release-predecessor
      - name: Acquire the actual immutable public Local predecessor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.6 --repo fased-ai/fased-app --dir .evidence/ubuntu-release-predecessor --pattern install.sh --pattern fased-release.json --pattern fased-app-linux-amd64.tar.gz --pattern fased-install-linux-amd64 --pattern fased-app-linux-amd64.provenance.sigstore.json
      - name: Run the actual released-predecessor Local journey only
        env:
          FASED_DISPOSABLE_VM_ACCEPTANCE: "1"
        run: python3 scripts/check-inspection-vm.py --staged-package-only --released-local-only --installed-agent --candidate .evidence/ubuntu-release --predecessor .evidence/ubuntu-release-predecessor --legacy-predecessor .evidence/ubuntu-release-predecessor
      - name: Remove only the owned CI KVM rule
        if: always()
        run: |
          if test -f .evidence/99-fased-fixture-kvm.rules && sudo cmp -s .evidence/99-fased-fixture-kvm.rules /etc/udev/rules.d/99-fased-fixture-kvm.rules; then
            sudo rm -- /etc/udev/rules.d/99-fased-fixture-kvm.rules
            sudo udevadm control --reload-rules
          fi
      - name: Retain only the installed acceptance result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.candidate_run && format('ubuntu-amd64-installed-acceptance-replay-{0}-{1}', inputs.candidate_run, inputs.candidate_attempt) || format('ubuntu-amd64-installed-acceptance-{0}', github.run_attempt) }}
          if-no-files-found: error
          path: .evidence/b01-staged-installed/local/installed-acceptance.json
      - name: Retain the Local-bound installed agent evidence separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubuntu-amd64-installed-agent-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            .evidence/b01-staged-installed/local/installed-agent-acceptance.json
            .evidence/b01-staged-installed/local/installed-agent-observations.json
      - name: Retain a bounded sanitized owner failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubuntu-amd64-installed-failure-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            .evidence/b01-staged-installed/local/staged-owner-failure.json
            .evidence/b01-staged-installed/local/staged-browser-failure.json
            .evidence/b01-staged-installed/local/staged-vm-failure.json
            # Retain completed public lifecycle proof if the later agent leg fails.
            .evidence/b01-staged-installed/local/installed-acceptance.json
