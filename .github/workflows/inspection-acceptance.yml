name: P4 fixture fault and reboot acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/update/**"
      - "internal/custodyinstall/**"
      - "internal/signer/**"
      - "internal/core/**"
      - "internal/bootstrap/**"
      - "internal/localinstall/**"
      - "internal/vpsinstall/**"
      - "cmd/fased-app/application_*"
      - "cmd/fased-app/maintenance_authority_*"
      - "cmd/fased-app/inspection_*"
      - "cmd/fased-app/bootstrap_linux.go"
      - "cmd/fased-signer/inspection_*"
      - "scripts/*inspection*"
      - "scripts/fixture-core-storage.mjs"
      - "scripts/fixture-vm-guest.mjs"
      - "scripts/fixture-development-envelope.mjs"
      - "scripts/fixtures/application-reader-predecessor.go.txt"
      - ".github/workflows/inspection-acceptance.yml"
      - "scripts/ci-routing*"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.route.outputs.core }}
      desktop: ${{ steps.route.outputs.desktop }}
      signer: ${{ steps.route.outputs.signer }}
      handoff: ${{ steps.route.outputs.handoff }}
      handoff_uid: ${{ steps.route.outputs.handoff_uid }}
      inspection: ${{ steps.route.outputs.inspection }}
      vm: ${{ steps.route.outputs.vm }}
      scope: ${{ steps.route.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test scripts/ci-routing.test.mjs
      - id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p .evidence
          if [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] && git show "$BASE_SHA:scripts/ci-routing.mjs" > .evidence/trusted-ci-routing.mjs; then
            node .evidence/trusted-ci-routing.mjs plan
          else
            # Policy installation or unavailable base: require every lane.
            for lane in core desktop signer handoff handoff_uid inspection vm; do echo "$lane=true" >> "$GITHUB_OUTPUT"; done
            echo "scope=full" >> "$GITHUB_OUTPUT"
          fi
  inspection-vm:
    needs: classify
    if: needs.classify.outputs.vm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: npm ci && npm run build
      - name: Bounded status reconnect regression
        run: python3 scripts/test-fixture-inspection-probes.py
      - name: Focused fault/time and coupled bridge checks
        run: |
          mkdir -p .evidence/p4-fault-reboot
          go test -race -json -count=1 ./internal/update ./internal/custodyinstall ./cmd/fased-app -run '^(TestInspection|TestInstalledInspection|TestBootstrap)' > .evidence/p4-fault-reboot/focused.jsonl
      - name: Build test-only immutable readers and public exporter
        run: |
          go test -c -o .evidence/p4-fault-reboot/fased-app ./cmd/fased-app
          go test -c -o .evidence/p4-fault-reboot/update-tests ./internal/update
          go build -o .evidence/bin/fased-signer ./cmd/fased-signer
          node scripts/build-inspection-predecessor.mjs
      - name: Build the actual schema33 reader fixture
        run: |
          node scripts/build-inspection-predecessor.mjs --application-reader
          node scripts/build-inspection-predecessor.mjs --application-reader35
      - name: Verify authenticated older-reader handoff
        env:
          FASED_READER_PREDECESSOR: ${{ github.workspace }}/.evidence/b01-connected-install/reader-predecessor-schema33
          FASED_READER_PREDECESSOR35: ${{ github.workspace }}/.evidence/b01-connected-install/reader-predecessor-schema35
        run: |
          go test -race ./cmd/fased-app -run '^TestApplicationReaderCompiledPredecessorIPC$' -count=1
          go test -race ./cmd/fased-app -run '^TestApplicationReader35IPC$' -count=1
      - name: Disposable VM prerequisites
        run: |
          node --test scripts/ci-ubuntu-mirror.test.mjs
          node scripts/ci-ubuntu-mirror.mjs
          sudo install -m 0644 .evidence/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils xorriso acl
          if test -e /dev/kvm; then
            fased_vm_owner="$(id -un)"
            printf 'KERNEL=="kvm", OWNER="%s", MODE="0600"\n' "$fased_vm_owner" > .evidence/p4-fault-reboot/99-fased-fixture-kvm.rules
            sudo install -o root -g root -m 0644 .evidence/p4-fault-reboot/99-fased-fixture-kvm.rules /etc/udev/rules.d/99-fased-fixture-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
      - uses: actions/cache@v4
        with:
          path: |
            .evidence/p4-fault-reboot/ubuntu.img
            .evidence/p4-fault-reboot/node-v24.10.0-linux-x64.tar.xz
          key: ubuntu-noble-b3296484e362ba2e-node24.10.0
      - name: Actual interruption, kernel reboot and protected recovery
        env:
          FASED_DISPOSABLE_VM_ACCEPTANCE: "1"
        run: python3 scripts/check-inspection-vm.py --full
      - name: Remote maintenance kernel authority
        env:
          FASED_DISPOSABLE_VM_ACCEPTANCE: "1"
        run: python3 scripts/check-inspection-vm.py --maintenance-only
      - name: Compose finalizer-produced disposable Remote update
        run: |
          mkdir -p .evidence/b01-finalized-update/vm/inputs
          CGO_ENABLED=0 go test -c -tags=fased_finalizer_vm -ldflags '-s -w' -o .evidence/b01-finalized-update/vm/inputs/fased-app-tests ./cmd/fased-app
          CGO_ENABLED=0 go test -c -tags=fased_finalizer_vm -ldflags '-s -w -X github.com/fased-ai/fased-app/internal/core.Version=0.1.0' -o .evidence/b01-finalized-update/vm/target ./cmd/fased-app
          FASED_UPDATE_FIXTURE_INPUTS="$GITHUB_WORKSPACE/.evidence/b01-finalized-update/vm/inputs" FASED_UPDATE_FIXTURE_TARGET="$GITHUB_WORKSPACE/.evidence/b01-finalized-update/vm/target" FASED_UPDATE_FIXTURE_FINALIZER=1 .evidence/b01-finalized-update/vm/inputs/fased-app-tests -test.run='^TestApplicationUpdateVMInputs$' -test.v
          cat .evidence/b01-finalized-update/vm/input-receipt.json
      - name: Finalized metadata installed update, reboot recovery and authenticated no-op
        env:
          FASED_DISPOSABLE_VM_ACCEPTANCE: "1"
        run: python3 scripts/check-inspection-vm.py --installed-finalizer-update-only
      - name: Remove only the owned CI KVM rule
        if: always()
        run: |
          if test -f .evidence/p4-fault-reboot/99-fased-fixture-kvm.rules && sudo cmp -s .evidence/p4-fault-reboot/99-fased-fixture-kvm.rules /etc/udev/rules.d/99-fased-fixture-kvm.rules; then
            sudo rm -- /etc/udev/rules.d/99-fased-fixture-kvm.rules
            sudo udevadm control --reload-rules
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspection-fault-reboot
          include-hidden-files: true
          path: |
            .evidence/p4-fault-reboot/*.json
            .evidence/p4-fault-reboot/*.jsonl
            .evidence/p4-fault-reboot/*.log
            .evidence/p4-fault-reboot/*.stderr
            .evidence/b01-connected-install/*.json
            .evidence/b01-connected-install/vm/*.json
            .evidence/b01-connected-install/vm/*.log
            .evidence/b01-connected-install/installed-remote/*.json
            .evidence/b01-connected-install/installed-remote/*.log
            .evidence/b01-connected-install/installed-remote/*.stderr
            .evidence/b01-finalized-update/vm/*.json
            .evidence/b01-finalized-update/vm/*.log
            .evidence/b01-finalized-update/vm/*.stderr
          retention-days: 7
