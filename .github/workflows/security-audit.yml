name: Security Audit & Fuzz

on:
  schedule:
    - cron: "30 8 * * 1"
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: "Duration per Go fuzz target (e.g. 5s, 15s)"
        type: string
        required: false
        default: "5s"

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-security-and-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - name: Go static checks
        run: |
          go vet ./...
          go -C desktop vet ./...
      - name: Go vulnerability audit (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          # Enforce zero reachable vulnerabilities across all shipping binaries & desktop module.
          govulncheck ./cmd/fased-app ./cmd/fased-signer ./cmd/fased-install ./cmd/fased-package ./cmd/fased-release-candidate
          (cd desktop && govulncheck ./...)
      - name: Bounded Go fuzzing across all discovered fuzz targets
        env:
          FASED_FAST_TEST_KDF: "1"
          FUZZ_TIME: ${{ inputs.fuzz_time || '5s' }}
        run: |
          set -euo pipefail
          for pkg in $(go list ./internal/...); do
            for fn in $(go test -list '^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true); do
              echo "=== Fuzzing ${pkg} :: ${fn} (${FUZZ_TIME}) ==="
              go test -run='^$' -fuzz="^${fn}\$" -fuzztime="${FUZZ_TIME}" "${pkg}"
            done
          done
      - name: Production npm dependency audit
        run: npm audit --omit=dev --audit-level=high
