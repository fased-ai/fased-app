version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "gomod"
    directory: "/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      desktop-go-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned by scripts/fixture-core-storage.mjs against baseline v0.1.6 for predecessor determinism:
      - dependency-name: "lucide-react"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@playwright/test"
      - dependency-name: "@types/node"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      - dependency-name: "@vitejs/plugin-react"
      - dependency-name: "prettier"
      - dependency-name: "typescript"
      - dependency-name: "vite"
      - dependency-name: "vitest"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      actions-all:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
